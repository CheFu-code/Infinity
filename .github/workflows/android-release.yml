name: Android Release Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Required secrets are missing."
            echo "Please set:"
            echo "ANDROID_KEYSTORE_BASE64"
            echo "ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode Android keystore
        shell: bash
        run: |
          mkdir -p android/app

          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > android/app/upload.keystore

          ls -l android/app/upload.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Inspect React Native packages
        shell: bash
        run: |
          echo "========================================"
          echo "Node version"
          echo "========================================"
          node --version

          echo "========================================"
          echo "npm version"
          echo "========================================"
          npm --version

          echo "========================================"
          echo "Package versions"
          echo "========================================"

          node -e "
            const p = require('./package.json');

            console.log(JSON.stringify({
              reactNative:
                p.dependencies?.['react-native'] ||
                p.devDependencies?.['react-native'],

              googleAds:
                p.dependencies?.['react-native-google-mobile-ads'] ||
                p.devDependencies?.['react-native-google-mobile-ads'],

              codegen:
                p.dependencies?.['@react-native/codegen'] ||
                p.devDependencies?.['@react-native/codegen']
            }, null, 2));
          "

          echo "========================================"
          echo "Installed packages"
          echo "========================================"

          npm list \
            react-native \
            react-native-google-mobile-ads \
            @react-native/codegen \
            --depth=0 || true

      - name: Inspect Google Mobile Ads Codegen configuration
        shell: bash
        run: |
          echo "========================================"
          echo "Google Mobile Ads package"
          echo "========================================"

          node -e "
            const p = require('./node_modules/react-native-google-mobile-ads/package.json');

            console.log(JSON.stringify({
              name: p.name,
              version: p.version,
              peerDependencies: p.peerDependencies,
              codegenConfig: p.codegenConfig
            }, null, 2));
          "

          echo "========================================"
          echo "Google Mobile Ads package location"
          echo "========================================"

          node -e "
            console.log(
              require.resolve(
                'react-native-google-mobile-ads/package.json'
              )
            );
          "

          echo "========================================"
          echo "React Native package location"
          echo "========================================"

          node -e "
            console.log(
              require.resolve(
                'react-native/package.json'
              )
            );
          "

          echo "========================================"
          echo "Codegen package location"
          echo "========================================"

          node -e "
            console.log(
              require.resolve(
                '@react-native/codegen/package.json'
              )
            );
          "

      - name: Inspect Google Mobile Ads source specs
        shell: bash
        run: |
          echo "========================================"
          echo "Google Mobile Ads source directories"
          echo "========================================"

          find node_modules/react-native-google-mobile-ads \
            -maxdepth 3 \
            -type f \
            \( -name "*.js" -o -name "*.ts" -o -name "*.tsx" \) \
            | sort

          echo "========================================"
          echo "Spec files"
          echo "========================================"

          find node_modules/react-native-google-mobile-ads \
            -type f \
            \( -name "*Spec.ts" -o -name "*Spec.tsx" -o -name "*Native*.ts" -o -name "*Native*.tsx" \) \
            | sort

      - name: Run React Native Codegen directly
        shell: bash
        run: |
          echo "========================================"
          echo "React Native Codegen"
          echo "========================================"

          node -e "
            console.log(
              require.resolve(
                'react-native/scripts/generate-codegen-artifacts.js'
              )
            );
          "

          echo "========================================"
          echo "Codegen help"
          echo "========================================"

          node node_modules/react-native/scripts/generate-codegen-artifacts.js \
            --help

      - name: Generate React Native Codegen artifacts directly
        shell: bash
        run: |
          echo "========================================"
          echo "Generating Codegen artifacts"
          echo "========================================"

          node node_modules/react-native/scripts/generate-codegen-artifacts.js \
            --path . \
            --targetPlatform android \
            --outputPath android/build/generated/codegen
      - name: Build Android release APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=upload.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk