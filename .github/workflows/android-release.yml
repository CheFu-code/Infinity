name: Android Release Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Patch Google Mobile Ads NativeAppModule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "node_modules/react-native-google-mobile-ads/src/specs/modules/NativeAppModule.ts"
          )

          text = file.read_text()

          old_import = "import type { CodegenTypes } from 'react-native';"
          new_import = "import type { UnsafeObject } from 'react-native/Libraries/Types/CodegenTypes';"

          if old_import not in text:
              raise SystemExit(
                  "Expected CodegenTypes import was not found. "
                  "The installed Google Mobile Ads package may have changed."
              )

          text = text.replace(old_import, new_import)
          text = text.replace("CodegenTypes.UnsafeObject", "UnsafeObject")

          file.write_text(text)
          PY

          echo "========================================"
          echo "Patched NativeAppModule.ts"
          echo "========================================"

          sed -n '15,60p' \
            node_modules/react-native-google-mobile-ads/src/specs/modules/NativeAppModule.ts

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Required secrets are missing."
            echo "Please set:"
            echo "ANDROID_KEYSTORE_BASE64"
            echo "ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode Android keystore
        shell: bash
        run: |
          mkdir -p android/app

          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > android/app/upload.keystore

          ls -l android/app/upload.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Inspect versions
        shell: bash
        run: |
          echo "========================================"
          echo "Node"
          echo "========================================"
          node --version

          echo "========================================"
          echo "React Native"
          echo "========================================"
          node -e "console.log(require('react-native/package.json').version)"

          echo "========================================"
          echo "Google Mobile Ads"
          echo "========================================"
          node -e "console.log(require('react-native-google-mobile-ads/package.json').version)"

          echo "========================================"
          echo "React Native Codegen"
          echo "========================================"
          node -e "console.log(require('@react-native/codegen/package.json').version)"

      - name: Test Google Mobile Ads Codegen
        working-directory: android
        shell: bash
        run: |
          echo "========================================"
          echo "Testing Google Mobile Ads Codegen"
          echo "========================================"

          ./gradlew :react-native-google-mobile-ads:generateCodegenSchemaFromJavaScript \
            --stacktrace \
            --console=plain \
            -PMYAPP_UPLOAD_STORE_FILE=upload.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build Android release APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=upload.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk