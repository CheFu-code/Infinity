name: Android Release Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Required secrets are missing."
            echo "Please set:"
            echo "ANDROID_KEYSTORE_BASE64"
            echo "ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode Android keystore
        shell: bash
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload.keystore
          ls -l android/app/upload.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Inspect React Native packages
        shell: bash
        run: |
          echo "========================================"
          echo "Node version"
          echo "========================================"
          node --version

          echo "========================================"
          echo "npm version"
          echo "========================================"
          npm --version

          echo "========================================"
          echo "package.json versions"
          echo "========================================"
          node -e "const p=require('./package.json'); console.log(JSON.stringify({reactNative:p.dependencies?.['react-native'] || p.devDependencies?.['react-native'], googleAds:p.dependencies?.['react-native-google-mobile-ads'] || p.devDependencies?.['react-native-google-mobile-ads'], codegen:p.dependencies?.['@react-native/codegen'] || p.devDependencies?.['@react-native/codegen']}, null, 2))"

          echo "========================================"
          echo "Installed package versions"
          echo "========================================"
          npm list react-native react-native-google-mobile-ads @react-native/codegen --depth=0 || true

          echo "========================================"
          echo "Google Mobile Ads package information"
          echo "========================================"
          node -e "const p=require('./node_modules/react-native-google-mobile-ads/package.json'); console.log(JSON.stringify({name:p.name, version:p.version, peerDependencies:p.peerDependencies}, null, 2))"

      - name: Diagnose Google Mobile Ads Codegen
        working-directory: android
        shell: bash
        run: |
          echo "========================================"
          echo "Running Google Mobile Ads Codegen"
          echo "========================================"

          ./gradlew :react-native-google-mobile-ads:generateCodegenSchemaFromJavaScript \
            --stacktrace \
            --info \
            --console=plain \
            -PMYAPP_UPLOAD_STORE_FILE=upload.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build Android release APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=upload.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk