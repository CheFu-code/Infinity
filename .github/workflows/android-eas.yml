name: Android Gradle Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        if: secrets.MYAPP_UPLOAD_STORE_FILE_BASE64 != ''
        run: |
          mkdir -p android/app
          echo "${{ secrets.MYAPP_UPLOAD_STORE_FILE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew androidRelease \
            -PMYAPP_UPLOAD_STORE_FILE=app/release.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }} \
            -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }} \
            -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk
